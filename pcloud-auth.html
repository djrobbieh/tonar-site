<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tonar — Returning to the app</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         max-width: 640px; margin: 0 auto; padding: 48px 24px; line-height: 1.6;
         background: #0b0b0d; color: #e8e6e1; text-align: center; }
  a { color: #e0a458; }
  .muted { color: #9a968e; font-size: 0.9rem; }
</style>
<script>
  // pCloud only redirects to https URLs. The sign-in result arrives here in the
  // URL fragment (never sent to any server) and is handed straight to the app.
  (function () {
    var target = "tonar://pcloud-auth" + window.location.search + window.location.hash;
    var link = document.currentScript;
    window.addEventListener("DOMContentLoaded", function () {
      document.getElementById("open").setAttribute("href", target);
    });
    window.location.replace(target);
  })();
</script>
</head>
<body>
<h1>Returning to Tonar…</h1>
<p>If nothing happens, <a id="open" href="tonar://pcloud-auth">open Tonar</a>.</p>
<p class="muted">This page is part of the pCloud sign-in. Nothing is stored here.</p>
</body>
</html>
